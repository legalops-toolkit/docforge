name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check pyproject.toml / requirements.txt are in sync
        run: python3 scripts/check_deps_sync.py
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest with coverage (fails under 90%)
        run: pytest -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (always, validates Dockerfile on every PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: docforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name docforge-smoke -p 8000:8000 docforge:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then echo "healthy"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || (docker logs docforge-smoke && exit 1)
          docker stop docforge-smoke

      # Публикуем в GHCR только для push в main (не для PR из форков —
      # там нет доступа к секретам), с тегом edge как "последняя из main".
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
