name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Checks (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Порядок — от дешёвого к дорогому: расхождение версий и ошибка стиля
      # ловятся за секунды, тесты с NER-моделями стоят заметно дороже.
      # Команды совпадают с целями Makefile (`make lint`, `make test`), чтобы
      # локальный прогон и CI проверяли ровно одно и то же.
      - name: Check dependency files are in sync
        run: python scripts/check_deps_sync.py

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Run tests
        run: pytest -v

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Без `if: always()`: собирать образ из кода, который не прошёл проверки,
    # смысла нет — зелёная сборка на красных тестах только вводит в заблуждение.
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: docforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
