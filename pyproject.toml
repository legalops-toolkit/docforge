[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge"
version = "1.0.0"
description = "API для автоматической генерации юридических документов и извлечения сущностей из судебных решений"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DocForge contributors" }]
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.0",
    "python-docx==0.8.11",
    "jinja2==3.1.3",
    "natasha==1.6.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.27.0",
    "ruff==0.3.0",
    "mypy==1.8.0",
    "pre-commit==3.6.2",
]

[project.urls]
Repository = "https://github.com/legalops-toolkit/docforge"
Issues = "https://github.com/legalops-toolkit/docforge/issues"
Changelog = "https://github.com/legalops-toolkit/docforge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
